name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. LINT & CODE FORMATTING CHECK
  # ============================================================================
  lint-and-format:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check code style and rules (Ruff Check)
        run: ruff check sgu_mcp tests

      - name: Check code formatting (Ruff Format)
        run: ruff format --check sgu_mcp tests

  # ============================================================================
  # 2. STATIC TYPE CHECKING
  # ============================================================================
  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run Mypy Type Checking
        run: mypy sgu_mcp

  # ============================================================================
  # 3. SECURITY & VULNERABILITY AUDIT
  # ============================================================================
  security-audit:
    name: Security Scan (Bandit & Pip-Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Static Security Analysis (Bandit)
        run: bandit -r sgu_mcp -ll

      - name: Audit Dependencies for CVEs (Pip-Audit)
        run: pip-audit -r requirements.txt

  # ============================================================================
  # 4. CROSS-PLATFORM & MULTI-PYTHON MATRIX TESTS
  # ============================================================================
  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: [lint-and-format, type-check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies & test runners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run test suite with Coverage
        run: |
          pytest --cov=sgu_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact (Ubuntu - Python 3.12)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================================
  # 5. DOCKER BUILD & CONTAINER SMOKE TEST
  # ============================================================================
  docker-smoke-test:
    name: Docker Build & Health Check
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: sgu-academic-mcp:ci

      - name: Run container & verify healthcheck
        run: |
          docker run -d --name mcp-ci-test \
            -p 8000:8000 \
            -e SGU_STUDENT_ID="test" \
            -e SGU_PASSWORD="test" \
            sgu-academic-mcp:ci

          echo "Waiting for container to initialize..."
          sleep 5

          echo "Testing /health endpoint..."
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/health

          docker logs mcp-ci-test
          docker stop mcp-ci-test
