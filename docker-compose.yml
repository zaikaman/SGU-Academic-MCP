services:
  sgu-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: sgu-mcp-server:latest
    container_name: sgu_mcp_academic_server
    restart: unless-stopped
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./sgu_mcp:/app/sgu_mcp
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
