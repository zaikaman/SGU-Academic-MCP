services:
  sgu-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgu_mcp_academic_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_PORT=8000
